name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live Supabase browser QA (creates QA users/cases)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax check
        run: node --check app.js && node --check config.js
      - name: Static smoke tests (no network, no data writes)
        run: node --test tests/smoke/app.smoke.mjs
      - name: No privileged Supabase keys in the repo
        run: |
          if grep -rInE "service_role|sb_secret_|SUPABASE_SERVICE" --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=smoke --exclude=ci.yml --exclude=README.md --exclude=ARCHITECTURE.md .; then
            echo "Privileged key reference found"; exit 1
          fi
      - name: CSP must not allow third-party scripts
        run: grep -q "script-src 'self';" index.html
  e2e:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Backend-free smoke tests
        run: npx playwright test
        env: { CI: "true" }
      - name: Live Supabase QA (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.live
        run: npx playwright test
        env: { CI: "true", E2E_LIVE: "1" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
